name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.npmrc'
      - '.nvmrc'
      - 'docs/**'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vite.config.ts'

env:
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_PREFER_OFFLINE: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Restore optimized image assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            public/**/*.avif
            public/.asset-cache.json
          key: optimized-assets-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/optimize-assets.mjs', 'scripts/assets/xrdocs-icon.png', 'public/**/*.png', 'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.webp') }}
          restore-keys: |
            optimized-assets-${{ runner.os }}-

      - name: Build
        env:
          SKIP_GIT_UPDATED_AT: true
        run: npm run build
