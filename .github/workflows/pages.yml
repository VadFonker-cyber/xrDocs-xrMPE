name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - '.npmrc'
      - '.nvmrc'
      - 'docs/**'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vite.config.ts'
  workflow_dispatch:

env:
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_PREFER_OFFLINE: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout production
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install production dependencies
        run: npm ci

      - name: Restore optimized production image assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            public/**/*.avif
            public/.asset-cache.json
          key: optimized-assets-production-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/optimize-assets.mjs', 'scripts/assets/xrdocs-icon.png', 'public/**/*.png', 'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.webp') }}
          restore-keys: |
            optimized-assets-production-${{ runner.os }}-

      - name: Verify production statistics secrets
        env:
          VITE_UMAMI_SCRIPT_URL: ${{ secrets.VITE_UMAMI_SCRIPT_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
        run: |
          test -n "$VITE_UMAMI_SCRIPT_URL" || { echo "VITE_UMAMI_SCRIPT_URL secret is required for Pages analytics."; exit 1; }
          test -n "$VITE_UMAMI_WEBSITE_ID" || { echo "VITE_UMAMI_WEBSITE_ID secret is required for Pages analytics."; exit 1; }

      - name: Build production
        env:
          SITE_URL: https://vadphonker.github.io/xrDocs-xrMPE/
          VITE_BASE_PATH: /xrDocs-xrMPE/
          VITE_UMAMI_DOMAINS: vadphonker.github.io
          VITE_UMAMI_SCRIPT_URL: ${{ secrets.VITE_UMAMI_SCRIPT_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Assemble Pages artifact without develop
        run: |
          mkdir -p pages-dist
          cp -a dist/. pages-dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
