name: Manage Develop Pages

on:
  workflow_dispatch:
    inputs:
      action:
        description: Develop site action
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - remove

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Checkout develop
        if: inputs.action == 'deploy'
        uses: actions/checkout@v6
        with:
          ref: develop
          path: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: production/.nvmrc
          cache: npm
          cache-dependency-path: production/package-lock.json

      - name: Install production dependencies
        working-directory: production
        run: npm ci

      - name: Restore optimized production image assets
        uses: actions/cache@v5.0.5
        with:
          path: |
            production/public/**/*.avif
            production/public/.asset-cache.json
          key: optimized-assets-production-${{ runner.os }}-${{ hashFiles('production/package-lock.json', 'production/scripts/optimize-assets.mjs', 'production/scripts/assets/xrdocs-icon.png', 'production/public/**/*.png', 'production/public/**/*.jpg', 'production/public/**/*.jpeg', 'production/public/**/*.webp') }}
          restore-keys: |
            optimized-assets-production-${{ runner.os }}-

      - name: Verify production statistics secrets
        env:
          VITE_UMAMI_SCRIPT_URL: ${{ secrets.VITE_UMAMI_SCRIPT_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
        run: |
          test -n "$VITE_UMAMI_SCRIPT_URL" || { echo "VITE_UMAMI_SCRIPT_URL secret is required for Pages analytics."; exit 1; }
          test -n "$VITE_UMAMI_WEBSITE_ID" || { echo "VITE_UMAMI_WEBSITE_ID secret is required for Pages analytics."; exit 1; }

      - name: Build production
        working-directory: production
        env:
          SITE_URL: https://vadfonker-cyber.github.io/xrDocs-xrMPE/
          VITE_BASE_PATH: /xrDocs-xrMPE/
          VITE_UMAMI_SCRIPT_URL: ${{ secrets.VITE_UMAMI_SCRIPT_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Install develop dependencies
        if: inputs.action == 'deploy'
        working-directory: develop
        run: npm ci

      - name: Restore optimized develop image assets
        if: inputs.action == 'deploy'
        uses: actions/cache@v5.0.5
        with:
          path: |
            develop/public/**/*.avif
            develop/public/.asset-cache.json
          key: optimized-assets-develop-${{ runner.os }}-${{ hashFiles('develop/package-lock.json', 'develop/scripts/optimize-assets.mjs', 'develop/scripts/assets/xrdocs-icon.png', 'develop/public/**/*.png', 'develop/public/**/*.jpg', 'develop/public/**/*.jpeg', 'develop/public/**/*.webp') }}
          restore-keys: |
            optimized-assets-develop-${{ runner.os }}-

      - name: Build develop
        if: inputs.action == 'deploy'
        working-directory: develop
        env:
          NOINDEX: true
          SITE_URL: https://vadfonker-cyber.github.io/xrDocs-xrMPE/develop/
          VITE_BASE_PATH: /xrDocs-xrMPE/develop/
          VITE_UMAMI_SCRIPT_URL: ${{ secrets.VITE_UMAMI_SCRIPT_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-dist
          cp -a production/dist/. pages-dist/
          if [ "${{ inputs.action }}" = "deploy" ]; then
            mkdir -p pages-dist/develop
            cp -a develop/dist/. pages-dist/develop/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ inputs.action == 'deploy' && 'https://vadfonker-cyber.github.io/xrDocs-xrMPE/develop/' || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
